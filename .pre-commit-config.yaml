repos:
  # One tool for both lint and format. black used to do the formatting here
  # and in CI, while ruff format was already installed as part of the linter —
  # and the two disagree on a handful of line breaks, so running the obvious
  # `ruff format` broke CI. They are compatible by design, so consolidating
  # reformatted five files and changed no behaviour.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  - repo: local
    hooks:
      # Runs against the project's own venv (not a pre-commit managed one) —
      # mypy needs the real django-stubs plugin wired up via
      # backend/pyproject.toml, and the project's installed dependencies to
      # resolve imports. Tries the Windows layout first, then POSIX.
      - id: mypy
        name: mypy
        entry: >-
          bash -c 'cd backend &&
          (test -f .venv/Scripts/python.exe && .venv/Scripts/python.exe -m mypy . ||
          .venv/bin/python -m mypy .)'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
