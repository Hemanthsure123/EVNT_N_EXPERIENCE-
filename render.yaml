# Render Blueprint — the 10-to-14-day test deployment.
#
# THREE SERVICES FROM ONE IMAGE. That is not a style choice: `web` alone is a
# platform where held ticket inventory is never released and organisers are
# never paid, because the jobs that do both are registered and simply never
# fire. See DEPLOYMENT.md §"Three processes, not one" — it is the single most
# expensive mistake available here, and it fails silently.
#
#   web        gunicorn          HTTP, the only service with a public URL
#   worker     config.worker     drains the outbox (emails, SMS, push)
#   scheduler  run_scheduled_jobs --once   the clock
#
# `apps/../run_scheduled_jobs` documents `--once` as "what production should
# run, driven by Cloud Scheduler, a Kubernetes CronJob or crontab" — so it maps
# onto a Render Cron Job exactly, with no long-lived process to wedge and the
# platform owning the retry.
#
# Apply with:  Render Dashboard -> Blueprints -> New Blueprint Instance
# Secrets marked `sync: false` are prompted for on apply and never live in git.

databases: []   # Supabase, not Render Postgres. See the runbook for why.

envVarGroups:
  # ── ONE GROUP, THREE SERVICES ────────────────────────────────────────────
  # Every service reads the same values. Three separate env lists is how the
  # worker ends up pointed at a different database than the web process, which
  # presents as "some emails never send" rather than as an error.
  - name: curatix-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # ── Secrets Render generates once and shares across the group ────────
      # 32+ chars each; `core/preflight.py` refuses anything shorter.
      #
      # TICKET_QR_SIGNING_KEY: generating a NEW one invalidates every QR code
      # already issued. Fine on a fresh test environment, catastrophic later —
      # if you ever recreate this blueprint against a database that already
      # holds tickets, paste the existing value instead.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: TICKET_QR_SIGNING_KEY
        generateValue: true

      # ── Data plane ──────────────────────────────────────────────────────
      # TWO Postgres URLs, and they are not interchangeable:
      #   DATABASE_URL         Supavisor transaction pooler, port 6543
      #   DIRECT_DATABASE_URL  session mode, port 5432 — migrations only
      # The pooler cannot run migrations (no session affinity for advisory
      # locks); the direct port cannot take app traffic at scale.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      # Behind a transaction pooler both of these must be off: the pooler
      # already reuses connections, and server-side cursors need affinity it
      # does not provide.
      - key: CONN_MAX_AGE
        value: "0"
      - key: DISABLE_SERVER_SIDE_CURSORS
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: CACHE_BACKEND
        value: redis

      # ── Adapter selection ───────────────────────────────────────────────
      # preflight REFUSES to boot if any of these is a local fake in
      # production. That is deliberate: a fake payment adapter boots healthy
      # and makes every checkout succeed for free.
      - key: PAYMENTS_BACKEND
        value: razorpay
      - key: STORAGE_BACKEND
        value: s3
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMS_PROVIDER
        value: console      # DLT registration takes weeks; console until then
      - key: QUEUE_BACKEND
        value: local        # the `worker` service IS the queue
      - key: EVENT_BUS_BACKEND
        value: local

      # ── Vendor credentials ──────────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Only obtainable AFTER the first deploy: you need the public URL to
      # register the webhook in the Razorpay dashboard. See runbook step 7.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

      # ── Public surface ──────────────────────────────────────────────────
      # ALLOWED_HOSTS must contain the Render hostname or every request 400s
      # with DisallowedHost. CORS must contain the Vercel origin or the
      # browser blocks every API call while the server logs nothing wrong.
      - key: ALLOWED_HOSTS
        sync: false          # curatix-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # https://<your-app>.vercel.app
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

services:
  # ── 1. WEB ───────────────────────────────────────────────────────────────
  - type: web
    name: curatix-api
    runtime: docker
    # Singapore is Render's closest region to a Supabase ap-south-1 project.
    # Every query still crosses ~50ms of ocean — which this codebase survives
    # only because its read paths are 1-2 queries, not because the distance is
    # harmless. See the runbook's note on region pairing.
    region: singapore
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # `/health/` PROBES the database and cache and returns 503 when either is
    # down, so a wedged Upstash fails the deploy instead of serving 500s to
    # customers. Render holds the old instance until this passes.
    healthCheckPath: /health/
    # Never deploy a commit CI has not accepted. The `image` job in ci.yml
    # already proves the container starts, runs as non-root, and imports every
    # SDK its backends select.
    autoDeployTrigger: checksPass
    # Migrations, run once before traffic shifts. `migrate_safe` holds a
    # Postgres advisory lock, so concurrent replicas serialise rather than
    # racing, and it uses the DIRECT (session-mode) alias.
    #
    # The repo's standing rule is that migrations are a reviewed step, not a
    # boot step. This line is a deliberate exception for a short-lived test
    # environment; for real production, delete it and run the migration by
    # hand from a Render Shell before deploying.
    preDeployCommand: python manage.py migrate_safe --yes
    envVars:
      - fromGroup: curatix-shared
      # Bounded by the CONNECTION POOLER, not the CPU — each worker holds its
      # own connections and exhausting Supavisor presents as a database
      # outage. 2 is right for a 512MB Starter instance; the app caps the
      # computed default at 9 regardless.
      - key: WEB_CONCURRENCY
        value: "2"

  # ── 2. WORKER ────────────────────────────────────────────────────────────
  # Drains the outbox. Without it, every email, SMS and push notification is
  # written to the database and never sent — with no error anywhere.
  - type: worker
    name: curatix-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m config.worker
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: curatix-shared

  # ── 3. SCHEDULER ─────────────────────────────────────────────────────────
  # Releases expired ticket holds, releases organiser payouts, reconciles
  # payments the browser never confirmed, sweeps stuck notifications.
  #
  # A CRON JOB rather than a background worker: `--once` is the mode the
  # command itself documents for production, it costs a fraction of a
  # long-lived instance, and there is no supervised loop to wedge. Every
  # minute, because the shortest job interval (payment reconcile) is 120s and
  # a held seat should not wait longer than that to come back.
  - type: cron
    name: curatix-scheduler
    runtime: docker
    region: singapore
    plan: starter
    schedule: "* * * * *"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python manage.py run_scheduled_jobs --once
    envVars:
      - fromGroup: curatix-shared
