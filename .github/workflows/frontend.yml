name: frontend

on:
  push:
    branches: [main]
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (JS/TS incl. no-raw-values rule)
        run: npm run lint
      - name: Lint (CSS incl. color-no-hex)
        run: npm run lint:css
      - name: Unit + component tests
        run: npm run test -- --pool=forks
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid/api
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          NEXT_PUBLIC_MEDIA_BASE_URL: https://ci.invalid
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_key
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci_google_maps_key
        run: npm run build
      - name: Bundle-size budget
        run: npm run check:bundle
      - name: Build Storybook
        run: npm run build-storybook

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E smoke + axe (light + dark)
        run: npm run e2e
