name: frontend

# On main this is a stage of `release.yml` (see the note in ci.yml), where it
# runs UNCONDITIONALLY — the paths filter below applies to pull requests only.
# That filter is why release used to carry a "did frontend even run for this
# SHA, and has frontend/ changed since the last green run?" branch; calling the
# workflow directly means the answer is always "it ran, for this commit".
on:
  workflow_call:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: frontend"
          echo "Job: quality"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Node version: $(node --version 2>/dev/null || echo N/A)"
          echo "npm version: $(npm --version 2>/dev/null || echo N/A)"
          echo "::endgroup::"
          echo "=== FRONTEND STAGE: QUALITY ==="

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          echo "Executing: npm ci"
          npm ci

      - name: Typecheck
        run: |
          echo "Executing: npm run typecheck"
          npm run typecheck

      - name: Lint (JS/TS incl. no-raw-values rule)
        run: |
          echo "Executing: npm run lint"
          npm run lint

      - name: Lint (CSS incl. color-no-hex)
        run: |
          echo "Executing: npm run lint:css"
          npm run lint:css

      - name: Unit + component tests
        run: |
          echo "Executing: npm run test -- --pool=forks"
          npm run test -- --pool=forks

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid/api
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          NEXT_PUBLIC_MEDIA_BASE_URL: https://ci.invalid
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_key
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci_google_maps_key
        run: |
          echo "=== NEXT.JS BUILD ==="
          echo "Command: npm run build"
          echo "Environment variable names present: NEXT_PUBLIC_API_BASE_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_MEDIA_BASE_URL, NEXT_PUBLIC_RAZORPAY_KEY_ID, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"
          npm run build

      - name: Build Failure Diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p /tmp/frontend-diagnostics
          echo "=== NEXT.JS BUILD FAILURE DIAGNOSTICS ===" > /tmp/frontend-diagnostics/build-report.txt
          echo "CWD: $(pwd)" >> /tmp/frontend-diagnostics/build-report.txt
          echo "Checking .next directory:" >> /tmp/frontend-diagnostics/build-report.txt
          ls -la .next >> /tmp/frontend-diagnostics/build-report.txt 2>&1 || true
          cat /tmp/frontend-diagnostics/build-report.txt

      - name: Bundle-size budget
        run: |
          echo "=== BUNDLE SIZE CHECK ==="
          echo "Configured Budget: 220 KB"
          echo "Executing: npm run check:bundle"
          npm run check:bundle

      - name: Build Storybook
        run: |
          echo "Executing: npm run build-storybook"
          npm run build-storybook

      - name: Upload Quality Diagnostics Artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-diagnostics
          path: /tmp/frontend-diagnostics/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    # ── A BOUND, NOT A BUFFER ───────────────────────────────────────────────
    # The job's real cost is ~6-8 min (npm ci, browser download, one production
    # build, then the specs). GitHub's default is 360 minutes, which is how a
    # broken run sat at 33m56s and another was still going at 30m44s instead of
    # failing fast and saying so. 20 is comfortably above a healthy run and far
    # below "nobody noticed for half an hour".
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: frontend"
          echo "Job: e2e"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Node version: $(node --version 2>/dev/null || echo N/A)"
          echo "npm version: $(npm --version 2>/dev/null || echo N/A)"
          echo "::endgroup::"
          echo "=== FRONTEND STAGE: E2E ==="

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # ── THESE MUST POINT AT THE FIXTURE BACKEND, NOT AT A DEAD HOST ────────
      #
      # `playwright.config.ts` starts `scripts/mock-api.mjs` on port 8000 and
      # the specs assert against the data it serves. This step used to build
      # with `NEXT_PUBLIC_API_BASE_URL=https://ci.invalid/api`, so the compiled
      # bundle never contacted that fixture: `.invalid` is a RESERVED TLD that
      # is guaranteed never to resolve, and `lib/api/client.ts` appends
      # `/api/v1`, making the URL `https://ci.invalid/api/api/v1/...` — wrong
      # twice over. Every data-driven spec then failed on a network error and
      # was retried once, which is where 30+ minutes went.
      #
      # `NEXT_PUBLIC_*` values are INLINED INTO THE BUNDLE at build time, and
      # the production build happens inside Playwright's `webServer` command,
      # which inherits this env — so this block is what the browser actually
      # calls. It cannot be set later or overridden at runtime.
      #
      # The base is a bare ORIGIN with no path, because client.ts builds
      # `${API_BASE_URL}/api/v1`. A trailing `/api` here double-prefixes it.
      - name: E2E smoke + axe (light + dark)
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_key
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci_google_maps_key
        run: |
          echo "Executing Playwright E2E: npm run e2e"
          echo "API base (fixture backend): $NEXT_PUBLIC_API_BASE_URL"
          echo "Site base:                  $NEXT_PUBLIC_SITE_URL"
          npm run e2e

      - name: Playwright E2E Failure Diagnostics
        if: ${{ failure() }}
        run: |
          echo "=== E2E FAILURE DIAGNOSTICS ==="
          echo "Playwright test run failed."
          echo "Checking playwright-report directory:"
          ls -la playwright-report 2>&1 || true

      - name: Upload Playwright Report Artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
