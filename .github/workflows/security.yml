name: security

# On main this is a stage of `release.yml` (see the note in ci.yml). The
# weekly schedule stays: a dependency advisory published after a commit merges
# must still be found, and nothing pushes to main on a quiet week.
on:
  workflow_call:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  python-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: security"
          echo "Job: python-deps"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Python version: $(python --version 2>/dev/null || echo N/A)"
          echo "pip version: $(pip --version 2>/dev/null || echo N/A)"
          echo "::endgroup::"
          echo "=== SECURITY STAGE: PYTHON DEPENDENCIES ==="

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install (production extras included)
        run: |
          echo "Executing: python -m pip install -e \".[razorpay,push,observability,s3]\""
          python -m pip install -e ".[razorpay,push,observability,s3]"

      - name: Print installed packages
        run: |
          echo "::group::Installed Python Packages"
          python -m pip list
          echo "::endgroup::"

      - name: pip-audit
        run: |
          mkdir -p /tmp/security-reports
          echo "Installing pip-audit..."
          python -m pip install pip-audit
          echo "Executing pip-audit command:"
          echo "python -m pip_audit --local --skip-editable --ignore-vuln CVE-2026-48587 --ignore-vuln CVE-2026-6873 --ignore-vuln CVE-2026-8404 --ignore-vuln CVE-2026-48588 --ignore-vuln CVE-2026-53877 --ignore-vuln CVE-2026-53878 --ignore-vuln PYSEC-2026-3447 --progress-spinner off"
          python -m pip_audit --local --skip-editable \
            --ignore-vuln CVE-2026-48587 \
            --ignore-vuln CVE-2026-6873 \
            --ignore-vuln CVE-2026-8404 \
            --ignore-vuln CVE-2026-48588 \
            --ignore-vuln CVE-2026-53877 \
            --ignore-vuln CVE-2026-53878 \
            --ignore-vuln PYSEC-2026-3447 \
            --progress-spinner off 2>&1 | tee /tmp/security-reports/pip-audit-report.txt

      - name: Upload pip-audit Report Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pip-audit-report
          path: /tmp/security-reports/pip-audit-report.txt
          retention-days: 7

  node-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: security"
          echo "Job: node-deps"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Node version: $(node --version 2>/dev/null || echo N/A)"
          echo "npm version: $(npm --version 2>/dev/null || echo N/A)"
          echo "::endgroup::"
          echo "=== SECURITY STAGE: NODE DEPENDENCIES ==="

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit (runtime dependencies)
        run: |
          mkdir -p /tmp/security-reports
          echo "Executing: npm audit --omit=dev --audit-level=critical"
          npm audit --omit=dev --audit-level=critical 2>&1 | tee /tmp/security-reports/npm-audit-runtime.txt

      - name: npm audit (everything, informational)
        run: |
          echo "Executing: npm audit"
          npm audit 2>&1 | tee /tmp/security-reports/npm-audit-all.txt || true

      - name: Upload npm audit Report Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-npm-audit-report
          path: /tmp/security-reports/
          retention-days: 7

  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: security"
          echo "Job: filesystem"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Trivy: official aquasec/trivy image, run directly (no wrapper action)"
          echo "Docker version: $(docker --version 2>/dev/null || echo N/A)"
          echo "Scan type: fs"
          echo "Scan ref: ."
          echo "Severity threshold: CRITICAL,HIGH"
          echo "Ignore unfixed: true"
          echo "Ignore file: .trivyignore.yaml (per-CVE, justified, expiring)"
          echo "Exit code: 1"
          echo "::endgroup::"
          echo "=== SECURITY STAGE: FILESYSTEM SCAN ==="

      # ── WHY THE VERSION MATTERS MORE THAN IT LOOKS ──────────────────────
      #
      # This was pinned to v0.29.0, and that pin is what broke the job — not
      # any finding. trivy-action is a COMPOSITE action whose first step is
      # `uses: aquasecurity/setup-trivy@v0.2.2`, and upstream deleted the
      # v0.2.1/v0.2.2 tags from that repository. GitHub resolves nested action
      # references during "Set up job", so the job died there in 4 seconds,
      # before checkout, before Trivy existed, with no scan output at all —
      # which is why a passing local scan proved nothing about it.
      #
      # v0.31.0 onwards pin setup-trivy by COMMIT SHA, which cannot be
      # deleted or moved. Verified resolvable:
      #   v0.33.1 -> setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1
      # Do not "simplify" this back to a version below v0.31.0, and do not use
      # @master — that reintroduces an unpinned third party on the security
      # gate.
      # ── TRIVY IS RUN DIRECTLY, NOT THROUGH trivy-action ─────────────────
      #
      # The action was removed from this gate after it failed three different
      # ways without ever scanning anything:
      #
      #   1. Pinned at v0.29.0 it died in "Set up job" in 4s, because it is a
      #      COMPOSITE action whose first step is
      #      `uses: aquasecurity/setup-trivy@v0.2.2` — a tag upstream deleted.
      #      A third party can break this gate by retagging their own repo.
      #   2. Its `trivyignores:` input `cat`s the file into an extensionless
      #      `./trivyignores`, and Trivy picks the ignore FORMAT from the
      #      EXTENSION — so a `.yaml` policy is silently read as a flat id
      #      list and stops ignoring anything.
      #   3. Repinned and with the ignore file passed by env, it still failed
      #      in 3s — less time than downloading the vulnerability DB takes, so
      #      the scan was not running at all.
      #
      # Every one of those is a failure of the WRAPPER, not of Trivy. So the
      # wrapper is gone: this runs the official image at a pinned digest-able
      # tag with the exact command, which is also the command reproduced
      # locally (exit 0 with the ignore file, exit 1 without it, and exit 1
      # again when the file's `expired_at` is moved into the past).
      #
      # Nothing about the scan's strictness changed. Both scanners, CRITICAL
      # and HIGH blocking, a real non-zero exit, no continue-on-error.
      - name: Trivy filesystem scan
        env:
          TRIVY_VERSION: "0.65.0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/security-reports

          # Path exclusion lives here, NOT in the ignore file: these are the env
          # TEMPLATES, whose placeholder values trip the secret scanner. Finding
          # exclusion lives in .trivyignore.yaml, one justified expiring id each.
          SKIP=".env.example,.env.oci.example,.env.production.example,.env.staging.example,.env.tunnel.example,render.yaml"

          echo "::group::Trivy invocation"
          echo "image:       aquasec/trivy:${TRIVY_VERSION}"
          echo "scan:        fs ."
          echo "severity:    CRITICAL,HIGH   exit-code: 1   ignore-unfixed: true"
          echo "scanners:    vuln + secret (Trivy's default for fs)"
          echo "ignorefile:  .trivyignore.yaml"
          echo "skip-files:  $SKIP"
          echo "::endgroup::"

          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            "aquasec/trivy:${TRIVY_VERSION}" \
            fs . \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --ignorefile .trivyignore.yaml \
            --skip-files "$SKIP" \
            2>&1 | tee /tmp/security-reports/trivy-fs-report.txt

      - name: Trivy Scan Failure Diagnostics
        if: ${{ failure() }}
        run: |
          echo "=== TRIVY FILESYSTEM SCAN FAILURE DIAGNOSTICS ==="
          echo "The scan above exited non-zero. Two very different causes, and the"
          echo "scan DURATION tells them apart before you read anything else:"
          echo
          echo "  ~40s+  Trivy ran and FOUND something. The findings table is in the"
          echo "         log above and in the uploaded artifact. Fix the dependency;"
          echo "         only carry it in .trivyignore.yaml if no fix exists, with a"
          echo "         justification and an expiry."
          echo "  ~5s    Trivy never scanned — it could not start. Look for an image"
          echo "         pull failure or a vulnerability DB download failure"
          echo "         (ghcr.io rate limiting presents this way). This is NOT a"
          echo "         finding and must not be answered by adding an ignore."
          echo
          echo "Ignore policy currently in force:"
          grep -E "^\s+- id:|expired_at:" .trivyignore.yaml || true

      - name: Upload Trivy Report Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-trivy-fs-report
          path: /tmp/security-reports/trivy-fs-report.txt
          retention-days: 7
