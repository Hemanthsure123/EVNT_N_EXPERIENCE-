# Dependency and configuration scanning.
#
# ── WHY THIS IS NOT PART OF ci.yml ────────────────────────────────────────
#
# Two different failure modes. `ci.yml` fails when THIS commit is wrong;
# a security scan fails when the WORLD changed — an advisory published against
# a dependency nobody touched. That distinction matters operationally: a red
# CI means "fix your commit", a red scan often means "a CVE landed overnight".
# Mixing them makes a broken build indistinguishable from a new advisory.
#
# It also runs on a schedule, which `ci.yml` must not: a commit's correctness
# does not change at 3am, but its dependencies' known-vulnerability status
# does.
#
# ── SEVERITY THRESHOLDS, AND WHY EACH ONE ─────────────────────────────────
#
# Everything is REPORTED. What differs is what BLOCKS.
#
#   Trivy filesystem   CRITICAL, HIGH   block
#   pip-audit          any advisory     block (Python deps are small and
#                                       directly chosen; a HIGH here is on
#                                       code that actually runs)
#   npm audit          high, critical   block
#
# Nothing is silenced. Moderate and low findings appear in the job log and
# are not gates, because a permanently-red gate is one people learn to ignore
# — and an ignored gate is worse than an honest report. `ignore-unfixed` is
# NOT used here (unlike the release scan): at source level an unfixed
# advisory is still worth seeing on every run, because the fix may be to drop
# the dependency rather than upgrade it.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 04:00 UTC (09:30 IST) — a new advisory against an
    # untouched dependency is found by the schedule, not by the next commit.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  python-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The SAME extras the production image installs. Auditing only base
      # dependencies would miss razorpay, boto3 and reportlab — which is most
      # of what handles money, storage and untrusted input.
      - name: Install (production extras included)
        run: python -m pip install -e ".[razorpay,push,observability,s3]"

      - name: pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --local --skip-editable --progress-spinner off

  node-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # `--omit=dev` first: a vulnerability in a build-time-only package
      # cannot be reached by a visitor, so it must not block a deploy. The
      # full audit runs after it and is informational.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=critical

      - name: npm audit (everything, informational)
        run: npm audit || true

  # Source-tree scan: catches vulnerable lockfile entries and, importantly,
  # secrets accidentally committed. The image itself is scanned in
  # `release.yml`, against the artefact that will actually run.
  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          hide-progress: true
          # `secret` alongside `vuln`: this repository has a real history of
          # near-misses (a `.env` reachable by a type checker, a stray script
          # committed), and a committed credential is worse than any CVE here.
          scanners: vuln,secret
