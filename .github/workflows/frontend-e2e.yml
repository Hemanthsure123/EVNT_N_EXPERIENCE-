name: frontend-e2e

# ── WHY THIS IS ITS OWN WORKFLOW ──────────────────────────────────────────
#
# It is split from `frontend.yml` so the release pipeline can REQUIRE the
# frontend quality gate (typecheck, lint, unit tests, production build, bundle
# budget, Storybook) while this suite runs, reports, and does NOT block the
# deploy.
#
# That is a deliberate, temporary exception, and the reason is specific: this
# suite has never passed — 33 runs, 0 successes. It is STALE, not flaky.
# `app/(site)/page.tsx` was rewritten in c983c09 to lead with `<Showcase>`,
# and `tests/e2e/discovery.spec.ts` has not been touched since the earlier
# 30c162e. The specs still assert `<HomeHero>`, a component now imported
# NOWHERE: they expect `<h1>What do you feel like`, the app renders
# `<h1>Happening soon`. 38 of 92 specs assert a UI that no longer exists.
#
# Nothing here is skipped, disabled, marked flaky or given
# `continue-on-error`. The job runs every spec and goes RED when they fail, so
# the state stays visible rather than being hidden behind a green tick — it is
# simply not wired into `deploy`'s `needs:` until the specs are re-synced to
# the shipped UI.
#
# The exception EXPIRES. `core/tests/test_deployment_topology.py` fails once
# the date in it passes, which puts the decision back in front of a human
# instead of letting "temporary" become permanent. Re-syncing the specs is
# tracked in frontend/BACKLOG.md.
# ── TRIGGERED DIRECTLY, NEVER CALLED BY release.yml ───────────────────────
#
# This ran as a `uses:` stage inside release.yml, and that was wrong for a
# suite which deliberately gates nothing. A workflow run does not finish until
# EVERY job in it finishes, so this ~20-minute suite held release's
# `production-deploy` concurrency lock long after the deploy decision was
# made — and the NEXT push then queued behind it. A non-blocking suite was
# delaying every deployment by twenty minutes, which is the opposite of
# non-blocking.
#
# Running on `push` instead keeps everything that mattered — it still executes
# on every commit to main, still reports, still goes red — while making it
# structurally incapable of slowing a release down.
on:
  push:
    branches: [main]
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-e2e.yml']

# Its own group, and cancel-in-progress is TRUE here precisely because it
# gates nothing: the only interesting answer is the newest commit's, so an
# older in-flight run is worth cancelling rather than queueing. release.yml
# uses the opposite setting for the opposite reason — deploys must not be
# cancelled halfway.
concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  e2e:
    runs-on: ubuntu-latest
    # ── A BOUND, NOT A BUFFER ───────────────────────────────────────────────
    # GitHub's default is 360 minutes, which is how a broken run sat at 33m56s
    # instead of failing fast and saying so. This job must be bounded.
    #
    # 20 was an estimate ("~6-8 min") made before any run had finished, and it
    # was wrong in a way that hid everything behind it. MEASURED, from the run
    # on 00a55d3: setup is 79s (checkout, npm ci, browser download) and the
    # test step alone had used 1133s -- 18m53s -- when the job was killed. It
    # never reported, so a suite that has never once told anybody how many
    # specs fail looked like 36 "cancelled" runs that read as superseded.
    #
    # They were not superseded. Every one lasted 20m28s, 20m29s, 20m46s -- a
    # job killed by `timeout-minutes` is reported as CANCELLED, which is why
    # this went unread for 38 runs.
    #
    # The step is expensive for a real reason: `webServer` runs a full
    # production `npm run build` before a single spec, and failing specs are
    # retried once. 30 gives that room while still being far below "nobody
    # noticed for half an hour".
    #
    # Not touched: `workers: 1` in `playwright.config.ts`. The fixture holds
    # mutable state (`const bookings = new Map()`), so running specs in
    # parallel against one shared fixture is a correctness risk, not a speed
    # win. Halving the wall clock is not worth a suite that fails differently
    # depending on interleaving.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: frontend"
          echo "Job: e2e"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Node version: $(node --version 2>/dev/null || echo N/A)"
          echo "npm version: $(npm --version 2>/dev/null || echo N/A)"
          echo "::endgroup::"
          echo "=== FRONTEND STAGE: E2E ==="

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # ── THESE MUST POINT AT THE FIXTURE BACKEND, NOT AT A DEAD HOST ────────
      #
      # `playwright.config.ts` starts `scripts/mock-api.mjs` on port 8000 and
      # the specs assert against the data it serves. This step used to build
      # with `NEXT_PUBLIC_API_BASE_URL=https://ci.invalid/api`, so the compiled
      # bundle never contacted that fixture: `.invalid` is a RESERVED TLD that
      # is guaranteed never to resolve, and `lib/api/client.ts` appends
      # `/api/v1`, making the URL `https://ci.invalid/api/api/v1/...` — wrong
      # twice over. Every data-driven spec then failed on a network error and
      # was retried once, which is where 30+ minutes went.
      #
      # `NEXT_PUBLIC_*` values are INLINED INTO THE BUNDLE at build time, and
      # the production build happens inside Playwright's `webServer` command,
      # which inherits this env — so this block is what the browser actually
      # calls. It cannot be set later or overridden at runtime.
      #
      # The base is a bare ORIGIN with no path, because client.ts builds
      # `${API_BASE_URL}/api/v1`. A trailing `/api` here double-prefixes it.
      - name: E2E smoke + axe (light + dark)
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_key
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci_google_maps_key
        run: |
          echo "Executing Playwright E2E: npm run e2e"
          echo "API base (fixture backend): $NEXT_PUBLIC_API_BASE_URL"
          echo "Site base:                  $NEXT_PUBLIC_SITE_URL"
          npm run e2e

      - name: Playwright E2E Failure Diagnostics
        if: ${{ failure() }}
        run: |
          echo "=== E2E FAILURE DIAGNOSTICS ==="
          echo "This suite is currently NON-BLOCKING — a temporary exception for"
          echo "initial production infrastructure validation. It does not gate the"
          echo "deploy, and that is why the evidence below is kept: nothing else"
          echo "will stop a release to make somebody look at it."
          echo
          echo "Known state: the specs are STALE, not flaky. app/(site)/page.tsx was"
          echo "rewritten in c983c09 to lead with <Showcase>; the specs still assert"
          echo "<HomeHero>, which is imported nowhere. 38 of 92 fail for that reason."
          echo "See frontend/BACKLOG.md item 79 before assuming a new regression."
          echo
          echo "playwright-report:"; ls -la playwright-report 2>&1 || true
          echo "test-results (traces, screenshots, videos):"; ls -la test-results 2>&1 || true

      # ── UPLOADED ALWAYS, NOT ONLY ON FAILURE ────────────────────────────
      # `if: failure()` was enough while the suite gated the pipeline. It no
      # longer does, so a run that ends any other way — cancelled, timed out at
      # the 20-minute bound, or newly PASSING — would leave nothing behind to
      # compare against. The report is the only record of what this suite did.
      - name: Upload Playwright Report Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # Traces, screenshots and videos live here, not in the HTML report.
      - name: Upload Playwright Traces, Screenshots and Videos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
