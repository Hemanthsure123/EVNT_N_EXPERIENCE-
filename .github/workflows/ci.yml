name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: eventsdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d eventsdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret-not-for-production-0000000000
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://app:app@localhost:5432/eventsdb
      REDIS_URL: redis://localhost:6379/0
      JWT_SIGNING_KEY: ci-jwt-signing-key-not-for-production-000000
      PAYMENTS_BACKEND: fake
      STORAGE_BACKEND: local
      QUEUE_BACKEND: local
      EVENT_BUS_BACKEND: inprocess
      EMAIL_PROVIDER: console
      SMS_PROVIDER: console
      CACHE_BACKEND: locmem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .

      - name: Mypy
        run: python -m mypy .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest (with coverage)
        run: python -m pytest --cov=core --cov=apps --cov-report=term-missing
