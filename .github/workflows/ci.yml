name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: eventsdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d eventsdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret-not-for-production-0000000000
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://app:app@localhost:5432/eventsdb
      REDIS_URL: redis://localhost:6379/0
      JWT_SIGNING_KEY: ci-jwt-signing-key-not-for-production-000000
      PAYMENTS_BACKEND: fake
      STORAGE_BACKEND: local
      QUEUE_BACKEND: local
      EVENT_BUS_BACKEND: inprocess
      EMAIL_PROVIDER: console
      SMS_PROVIDER: console
      CACHE_BACKEND: locmem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The production extras are installed too, not just `dev`.
      #
      # With `[dev]` alone, every test that needs a vendor SDK skipped — and a
      # skip reads exactly like a pass in a green run. `core/tests/
      # test_s3_storage_adapter.py` was 14 silent skips, which is the same
      # "green because nobody looked" failure the production readiness audit
      # found in the image itself.
      #
      # Installing them together also proves the extras still RESOLVE
      # together. A version conflict between razorpay and boto3 would
      # otherwise first appear at image build time, on a deploy.
      #
      # Keep this list in step with INSTALL_EXTRAS in backend/Dockerfile —
      # `TestImagePackaging` in core/tests/test_deployment_topology.py fails
      # if they drift.
      # The `tickets` extra (reportlab) is gone with the booking PDF it existed
      # for — the confirmation is the EMAIL now, and the scannable code lives
      # in the app. It was called out here as NOT-optional-in-practice because
      # `templates.py` imported `ticket_pdf.py`, which imported reportlab at
      # module scope, from a chain reachable via `NotificationsConfig.ready()`;
      # missing it killed the whole job at collection. That chain no longer
      # exists, and the extra no longer does either.
      - name: Install dependencies
        run: python -m pip install -e ".[dev,razorpay,push,observability,s3]"

      - name: Ruff (lint)
        run: python -m ruff check .

      # `ruff format`, not black. The repo carried both: black was the
      # formatter CI checked, ruff format was the one already installed as the
      # linter — and they disagree on a handful of line breaks. Running the
      # obvious `ruff format` therefore broke CI, which is a footgun with no
      # upside. One formatter, no drift. (They are compatible by design, so
      # this reformatted five files and changed no behaviour.)
      - name: Ruff (format)
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest (with coverage)
        run: python -m pytest --cov=core --cov=apps --cov-report=term-missing

  # ── IMAGE VALIDATION ─────────────────────────────────────────────────────
  #
  # The `backend` job proves the code is correct and that the extras resolve
  # together in a plain virtualenv. It does NOT prove the IMAGE builds, and the
  # production readiness audit's two worst findings were both image packaging:
  # `pip install -e .` shipped without razorpay while PAYMENTS_BACKEND=razorpay,
  # so the first checkout raised ModuleNotFoundError — lazily imported, so
  # nothing failed at boot or in CI.
  #
  # `core/tests/test_deployment_topology.py` PARSES the Dockerfile, which
  # catches a wrong INSTALL_EXTRAS line. Only a real build catches a wheel that
  # needs a compiler the slim image does not have.
  #
  # No daemon-heavy work: build once, import the selected SDKs, done.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: eventful-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The check preflight performs at boot, performed here instead — so a
      # missing SDK fails a pull request rather than a customer's checkout.
      # Uses the real helper, which absorbs the ModuleNotFoundError that
      # `find_spec("google.cloud.storage")` raises when there is no `google`.
      - name: Every selected backend's SDK is installed
        run: |
          docker run --rm eventful-backend:ci python -c "
          from core.preflight import _module_importable as ok
          required = ['razorpay', 'cryptography', 'pywebpush', 'boto3', 'sentry_sdk', 'gunicorn']
          missing = [m for m in required if not ok(m)]
          assert not missing, f'image is missing: {missing}'
          print('all present:', required)
          "

      # `gcp` is deliberately NOT installed — Google Cloud is not in use, and
      # three unused client libraries are ~40MB and a standing CVE surface for
      # code that never runs. Preflight refuses a GCS/Pub-Sub/Cloud-Tasks
      # backend at boot rather than failing on first use.
      - name: The image carries no dependency it does not select
        run: |
          docker run --rm eventful-backend:ci python -c "
          from core.preflight import _module_importable as ok
          present = [m for m in ['google.cloud.storage', 'google.cloud.tasks_v2'] if ok(m)]
          assert not present, f'unused GCP libraries in the image: {present}'
          print('gcp correctly absent')
          "

      # A package can be PRESENT and unimportable — razorpay imports
      # `pkg_resources`, which setuptools 81 removed, so the package satisfied
      # `find_spec` and then raised on the first checkout. A path lookup cannot
      # see that; only an import can.
      - name: Every selected SDK actually imports
        run: |
          docker run --rm eventful-backend:ci python -c "
          import warnings; warnings.filterwarnings('ignore')
          import razorpay, cryptography, boto3, sentry_sdk, pywebpush
          print('every selected SDK imports for real')
          "

      - name: The container does not run as root
        run: |
          test "$(docker run --rm eventful-backend:ci id -u)" != "0"

      - name: The gunicorn configuration resolves
        run: |
          docker run --rm eventful-backend:ci python -c "
          ns = {}
          exec(compile(open('/app/docker/gunicorn.conf.py').read(), 'gunicorn.conf.py', 'exec'), ns)
          assert ns['workers'] >= 1 and ns['preload_app'] is False
          assert ns['graceful_timeout'] < 40, 'must stay under compose stop_grace_period'
          print('workers=%s threads=%s timeout=%s' % (ns['workers'], ns['threads'], ns['timeout']))
          "

  # ── THE FRONTEND IMAGE ──────────────────────────────────────────────────
  #
  # `frontend.yml` already runs `npm run build`, which proves the application
  # compiles. It does NOT prove the IMAGE builds, and those are different
  # failures: the Dockerfile's standalone-output copy, the non-root user, the
  # build args. The first EC2 deploy is the wrong place to discover that the
  # frontend Dockerfile has never been built by anything.
  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the production frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: eventful-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SYNTHETIC values, and they must be. `NEXT_PUBLIC_*` is compiled
          # into the client bundle, so a CI image is not deployable and is not
          # meant to be — this job proves the image BUILDS. The real values are
          # supplied by `release.yml` from Secrets Manager at publish time.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://ci.invalid/api
            NEXT_PUBLIC_SITE_URL=https://ci.invalid

      - name: The container does not run as root
        run: test "$(docker run --rm --entrypoint id eventful-frontend:ci -u)" != "0"

      # `output: 'standalone'` produces a self-contained server.js. If the
      # Dockerfile's copy misses `.next/static` or `public`, the container
      # starts and then serves an unstyled page with every image broken —
      # which looks like a CDN problem and is a packaging one.
      - name: The standalone server and its assets are in the image
        run: |
          docker run --rm --entrypoint sh eventful-frontend:ci -c '
            test -f server.js || { echo "server.js missing"; exit 1; }
            test -d .next/static || { echo ".next/static missing"; exit 1; }
            echo "standalone output complete"
          '

  # ── THE COMPOSE FILES ───────────────────────────────────────────────────
  #
  # `docker compose config` resolves merge keys, anchors, `!reset` tags and
  # `${VAR:?}` interpolation. The topology tests parse the same YAML with
  # PyYAML, which sees none of that — so a broken anchor or a merge that no
  # longer overrides passes every test and fails on the box.
  #
  # Nothing here starts a container and nothing here needs a secret: the values
  # below are placeholders that only have to be PRESENT for interpolation to
  # resolve. The rendered output is never printed — `config` inlines every
  # `env_file` value, so pasting it into a log would publish the entire `.env`.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CI environment file template
        run: test -f .env.example && cp .env.example .env || cp .env.tunnel.example .env

      - name: The base production file is valid
        run: docker compose -f docker-compose.yml config --quiet

      - name: The development overlay is valid
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

      - name: The EC2 overlay is valid
        env:
          BACKEND_IMAGE: registry.invalid/curatix-backend:0000000000000000000000000000000000000000
          FRONTEND_IMAGE: registry.invalid/curatix-frontend:0000000000000000000000000000000000000000
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid/api
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          SITE_DOMAIN: ci.invalid
        run: docker compose -f docker-compose.yml -f docker-compose.ec2.yml config --quiet

      # The assertion the topology tests cannot make, because it is only true
      # AFTER the merge: Compose appends `ports` lists across files, so `web`
      # keeping its inherited `8000:8000` would put Django on the public
      # internet behind nothing. This reads the RESOLVED configuration.
      - name: Behind Caddy, only Caddy publishes host ports
        env:
          BACKEND_IMAGE: registry.invalid/curatix-backend:0000000000000000000000000000000000000000
          FRONTEND_IMAGE: registry.invalid/curatix-frontend:0000000000000000000000000000000000000000
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid/api
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          SITE_DOMAIN: ci.invalid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ec2.yml config --format json \
            > /tmp/ec2.json
          python3 - <<'PY'
          import json
          services = json.load(open("/tmp/ec2.json"))["services"]
          offenders = {
              name: [p.get("published") for p in svc.get("ports", [])]
              for name, svc in services.items()
              if name != "caddy" and svc.get("ports")
          }
          assert not offenders, f"published to the host but not behind Caddy: {offenders}"
          published = {p.get("published") for p in services["caddy"]["ports"]}
          assert published == {"80", "443"}, f"caddy publishes {published}, expected 80 and 443"
          print("resolved topology: only caddy is public, on 80/443")
          PY

      # A shell script that runs on the production instance, checked by the
      # same standard as the Python. `-e` catches an unquoted variable that
      # word-splits a path, which is how a deploy script deletes the wrong
      # thing.
      - name: The deployment scripts pass shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning deploy/*.sh
