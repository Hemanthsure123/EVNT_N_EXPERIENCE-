name: CI

# ── ON MAIN THIS IS CALLED, NOT TRIGGERED ─────────────────────────────────
#
# `push: [main]` is deliberately absent. On main this workflow runs as the
# first stage of `release.yml`, which calls it with `uses:` — so the release
# depends on it through GitHub's own `needs:` graph and cannot start until it
# has actually passed for THIS commit.
#
# Before, release was triggered by this workflow finishing and then polled the
# GitHub API asking whether its siblings had passed. That is a race by
# construction, and it was losing: the poll gave up after 600s while the
# frontend E2E job was still running, so release failed on a timeout rather
# than on a result. `workflow_call` removes the question entirely.
#
# Pull requests still trigger it directly, unchanged.
on:
  workflow_call:
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: eventsdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d eventsdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret-not-for-production-0000000000
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://app:app@localhost:5432/eventsdb
      REDIS_URL: redis://localhost:6379/0
      JWT_SIGNING_KEY: ci-jwt-signing-key-not-for-production-000000
      PAYMENTS_BACKEND: fake
      STORAGE_BACKEND: local
      QUEUE_BACKEND: local
      EVENT_BUS_BACKEND: inprocess
      EMAIL_PROVIDER: console
      SMS_PROVIDER: console
      CACHE_BACKEND: locmem

    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: CI"
          echo "Job: backend"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Git version: $(git --version 2>/dev/null || echo N/A)"
          echo "Python version: $(python --version 2>/dev/null || echo N/A)"
          echo "pip version: $(pip --version 2>/dev/null || echo N/A)"
          echo "::endgroup::"
          echo "=== CI STAGE: BACKEND ==="

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,razorpay,push,observability,s3]"

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Ruff (format)
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest (with coverage)
        # ── `set -o pipefail` IS LOAD-BEARING, NOT STYLE ──────────────────
        #
        # The default shell here is `bash -e {0}`: `-e` is on, pipefail is NOT.
        # Without it the pipeline's status is `tee`'s, which always succeeds —
        # so a FAILING suite would report GREEN and the release gate would open
        # on a broken commit. That is strictly worse than the problem the tee
        # is here to solve, so the two lines belong together and neither may be
        # removed on its own.
        run: |
          set -o pipefail
          python -m pytest --cov=core --cov=apps --cov-report=term-missing 2>&1 | tee /tmp/pytest.out

      - name: Backend Failure Diagnostics
        if: ${{ failure() }}
        # ── IT EMITS ANNOTATIONS, BECAUSE THOSE ARE THE PUBLIC CHANNEL ────
        #
        # Actions LOGS require authentication — an unauthenticated reader gets
        # 403 — so a backend failure on `main` was, in practice, invisible: the
        # only public signal was "Process completed with exit code 1" against a
        # line number in a composed workflow. Diagnosing it meant reproducing
        # the whole runner locally and hoping.
        #
        # The first attempt at this wrote only to `$GITHUB_STEP_SUMMARY`, on
        # the belief that a job summary is surfaced as the check run's output.
        # IT IS NOT: the step ran, wrote its summary, and `output.summary` and
        # `output.text` both came back empty from the REST API. Measured, not
        # assumed — and the reason the summary write stays but is no longer the
        # thing being relied on.
        #
        # `::error::` workflow commands become ANNOTATIONS, and annotations ARE
        # served unauthenticated (`/check-runs/{id}/annotations`). So the names
        # of the failing tests travel with the failure instead of being locked
        # behind a login. The summary is kept alongside for whoever opens the
        # run page, where it is easier to read than a row of annotations.
        run: |
          # Every probe below is `|| true`. The shell is `bash -e`, and the
          # summary is written LAST — so one failing diagnostic (a `git` that
          # is unhappy, a `pip list` that errors) would abort this step before
          # the summary existed, losing the only public record of WHY the suite
          # failed. A diagnostic that can suppress the diagnosis is worse than
          # none.
          echo "=== BACKEND FAILURE DIAGNOSTICS ==="
          echo "CWD: $(pwd)"
          echo "Python executable: $(which python || true)"
          python -m pip list || true
          git status --short || true

          if [ -f /tmp/pytest.out ]; then
            {
              echo "### Backend suite failed"
              echo ""
              echo "Failing tests:"
              echo ""
              echo '```'
              # `|| true` because grep exits 1 on no match, and `-e` would then
              # fail this step — turning a diagnostic into a second failure.
              grep -E '^(FAILED|ERROR)' /tmp/pytest.out | head -50 || true
              echo '```'
              echo ""
              echo "Last 40 lines:"
              echo ""
              echo '```'
              tail -40 /tmp/pytest.out || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Backend job failed before pytest ran" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Backend::the job failed before pytest ran"
          fi

          # THE PART A LOGGED-OUT READER ACTUALLY SEES. One annotation per
          # failing test, capped so a wholesale breakage does not bury the
          # summary line under hundreds of them. A message may not contain a
          # raw newline, so each is one line by construction.
          if [ -f /tmp/pytest.out ]; then
            grep -E '^(FAILED|ERROR)' /tmp/pytest.out | head -15 | while IFS= read -r line; do
              echo "::error title=Backend test failed::${line}"
            done || true
            tally=$(grep -E '^[0-9]+ (failed|passed)|failed,' /tmp/pytest.out | tail -1 || true)
            [ -n "$tally" ] && echo "::error title=Backend suite::${tally}" || true
          fi

  image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: CI"
          echo "Job: image"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Docker version: $(docker --version 2>/dev/null || echo N/A)"
          echo "::endgroup::"
          echo "=== CI STAGE: IMAGE ==="

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: eventful-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Every selected backend's SDK is installed
        run: |
          docker run --rm eventful-backend:ci python -c "
          from core.preflight import _module_importable as ok
          required = ['razorpay', 'cryptography', 'pywebpush', 'boto3', 'sentry_sdk', 'gunicorn']
          missing = [m for m in required if not ok(m)]
          assert not missing, f'image is missing: {missing}'
          print('all present:', required)
          "

      - name: The image carries no dependency it does not select
        run: |
          docker run --rm eventful-backend:ci python -c "
          from core.preflight import _module_importable as ok
          present = [m for m in ['google.cloud.storage', 'google.cloud.tasks_v2'] if ok(m)]
          assert not present, f'unused GCP libraries in the image: {present}'
          print('gcp correctly absent')
          "

      - name: Every selected SDK actually imports
        run: |
          docker run --rm eventful-backend:ci python -c "
          import warnings; warnings.filterwarnings('ignore')
          import razorpay, cryptography, boto3, sentry_sdk, pywebpush
          print('every selected SDK imports for real')
          "

      - name: The container does not run as root
        run: |
          test "$(docker run --rm eventful-backend:ci id -u)" != "0"

      - name: The gunicorn configuration resolves
        run: |
          docker run --rm eventful-backend:ci python -c "
          ns = {}
          exec(compile(open('/app/docker/gunicorn.conf.py').read(), 'gunicorn.conf.py', 'exec'), ns)
          assert ns['workers'] >= 1 and ns['preload_app'] is False
          assert ns['graceful_timeout'] < 40, 'must stay under compose stop_grace_period'
          print('workers=%s threads=%s timeout=%s' % (ns['workers'], ns['threads'], ns['timeout']))
          "

  frontend-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: CI"
          echo "Job: frontend-image"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Docker version: $(docker --version 2>/dev/null || echo N/A)"
          echo "::endgroup::"
          echo "=== CI STAGE: FRONTEND IMAGE ==="

      - uses: docker/setup-buildx-action@v3

      - name: Build the production frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: eventful-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://ci.invalid/api
            NEXT_PUBLIC_SITE_URL=https://ci.invalid

      - name: The container does not run as root
        run: test "$(docker run --rm --entrypoint id eventful-frontend:ci -u)" != "0"

      - name: The standalone server and its assets are in the image
        run: |
          docker run --rm --entrypoint sh eventful-frontend:ci -c '
            test -f server.js || { echo "server.js missing"; exit 1; }
            test -d .next/static || { echo ".next/static missing"; exit 1; }
            echo "standalone output complete"
          '

  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "::group::Environment Diagnostics"
          echo "Workflow: CI"
          echo "Job: compose"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "CWD: $(pwd)"
          echo "Docker version: $(docker --version 2>/dev/null || echo N/A)"
          echo "Docker Compose version: $(docker compose version 2>/dev/null || echo N/A)"
          echo "::endgroup::"
          echo "=== CI STAGE: COMPOSE ==="

      - name: Verify required Compose files exist
        run: |
          echo "Checking Compose files..."
          for file in docker-compose.yml docker-compose.override.yml docker-compose.ec2.yml .env.example; do
            if [ -f "$file" ]; then
              echo "  [FOUND] $file ($(wc -c < "$file") bytes)"
            else
              echo "  [MISSING] $file"
              exit 1
            fi
          done

      - name: Create CI environment file template
        run: |
          echo "Generating .env from .env.example using cat..."
          cat .env.example > .env
          echo "Verified .env file created ($(wc -c < .env) bytes, $(wc -l < .env) lines)"

      - name: The base production file is valid
        run: |
          echo "Executing: docker compose -f docker-compose.yml config --quiet"
          docker compose -f docker-compose.yml config --quiet

      - name: The development overlay is valid
        run: |
          echo "Executing: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet"
          docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

      - name: The EC2 overlay is valid
        env:
          BACKEND_IMAGE: registry.invalid/curatix-backend:0000000000000000000000000000000000000000
          FRONTEND_IMAGE: registry.invalid/curatix-frontend:0000000000000000000000000000000000000000
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid/api
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          SITE_DOMAIN: ci.invalid
        run: |
          echo "Executing: docker compose -f docker-compose.yml -f docker-compose.ec2.yml config --quiet"
          echo "Present environment variable names: BACKEND_IMAGE, FRONTEND_IMAGE, NEXT_PUBLIC_API_BASE_URL, NEXT_PUBLIC_SITE_URL, SITE_DOMAIN"
          docker compose -f docker-compose.yml -f docker-compose.ec2.yml config --quiet

      - name: Behind Caddy, only Caddy publishes host ports
        env:
          BACKEND_IMAGE: registry.invalid/curatix-backend:0000000000000000000000000000000000000000
          FRONTEND_IMAGE: registry.invalid/curatix-frontend:0000000000000000000000000000000000000000
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid/api
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          SITE_DOMAIN: ci.invalid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ec2.yml config --format json \
            > /tmp/ec2.json
          python3 - <<'PY'
          import json
          services = json.load(open("/tmp/ec2.json"))["services"]
          offenders = {
              name: [str(p.get("published")) for p in svc.get("ports", [])]
              for name, svc in services.items()
              if name != "caddy" and svc.get("ports")
          }
          assert not offenders, f"published to the host but not behind Caddy: {offenders}"
          published = {str(p.get("published")) for p in services["caddy"]["ports"]}
          assert published == {"80", "443"}, f"caddy publishes {published}, expected 80 and 443"
          print("resolved topology: only caddy is public, on 80/443")
          PY

      - name: The deployment scripts pass shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning deploy/*.sh

      - name: Compose Failure Diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p /tmp/ci-diagnostics
          echo "=== COMPOSE FAILURE DIAGNOSTICS ===" > /tmp/ci-diagnostics/compose-report.txt
          echo "Date: $(date -u)" >> /tmp/ci-diagnostics/compose-report.txt
          echo "Directory Contents:" >> /tmp/ci-diagnostics/compose-report.txt
          ls -la >> /tmp/ci-diagnostics/compose-report.txt
          echo "Checking .env encoding and size:" >> /tmp/ci-diagnostics/compose-report.txt
          file .env 2>&1 >> /tmp/ci-diagnostics/compose-report.txt || true
          ls -l .env >> /tmp/ci-diagnostics/compose-report.txt || true
          echo "Attempting compose config output:" >> /tmp/ci-diagnostics/compose-report.txt
          docker compose -f docker-compose.yml config 2>&1 >> /tmp/ci-diagnostics/compose-report.txt || true
          cat /tmp/ci-diagnostics/compose-report.txt

      - name: Upload Compose Diagnostics Artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-compose-diagnostics
          path: /tmp/ci-diagnostics/
