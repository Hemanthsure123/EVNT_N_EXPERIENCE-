# =============================================================================
# Eventful — PRODUCTION topology
# =============================================================================
# This file describes what runs in production. It reads `.env` VERBATIM and
# overrides nothing, because the previous version did the opposite: it set
# `DATABASE_URL` and `REDIS_URL` in an `environment:` block, which takes
# precedence over `env_file:` — so a carefully configured Supabase and Upstash
# were silently ignored and every write went to a local Postgres.
#
# Local development now lives in `docker-compose.override.yml`, which Compose
# loads automatically. That file brings up Postgres/PgBouncer/Redis and points
# the app at them. The override is therefore explicit and named, rather than
# hidden inside the production file.
#
#   development  docker compose up -d
#                  (docker-compose.yml + docker-compose.override.yml)
#
#   production   docker compose -f docker-compose.yml up -d
#                  (this file only — .env is authoritative)
#
# Migrations are NOT run on boot. See the `migrate` profile below.
# =============================================================================

x-backend: &backend
  build:
    context: ./backend
  image: eventful-backend:latest
  restart: unless-stopped
  env_file:
    - .env
  # Deliberately NO `environment:` block. Anything here would silently outrank
  # .env, which is the bug this file exists to remove.
  stop_grace_period: 40s

services:
  # ── Web ─────────────────────────────────────────────────────────────────
  # Gunicorn, not `runserver`. Config in backend/docker/gunicorn.conf.py.
  # `stop_grace_period` (40s) exceeds gunicorn's `graceful_timeout` (30s) so a
  # deploy always lets an in-flight checkout finish rather than killing it
  # between recording a payment and issuing the ticket.
  web:
    <<: *backend
    command: ["gunicorn", "config.wsgi:application", "-c", "/app/docker/gunicorn.conf.py"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Scheduler ───────────────────────────────────────────────────────────
  # WITHOUT THIS PROCESS, held ticket inventory is never released and
  # ORGANIZERS ARE NEVER PAID. `core/scheduling.py` owns the intervals; this
  # only supplies the clock. Runs the supervised loop rather than `--once`
  # because Compose has no cron; on a platform that does (Cloud Scheduler, a
  # Kubernetes CronJob), prefer `run_scheduled_jobs --once` on a tick and drop
  # this service.
  #
  # Exactly ONE replica. Two schedulers would double-fire every job; the tasks
  # are idempotent so it would be survivable, not correct.
  scheduler:
    <<: *backend
    command: ["python", "manage.py", "run_scheduled_jobs"]
    deploy:
      replicas: 1
    healthcheck:
      # No HTTP surface, so liveness is "the process is still there". A
      # crashed loop exits, `restart: unless-stopped` brings it back, and this
      # catches the wedged-but-alive case for an operator reading `ps`.
      #
      # READS /proc/1 RATHER THAN CALLING pgrep. `pgrep` lives in procps, which
      # the python slim image does not ship — so this check exited 127 on every
      # run and BOTH background processes reported `unhealthy` forever while
      # doing their jobs perfectly. A health signal that is red because the
      # checker is missing is worse than no health signal: it trains an
      # operator to ignore the column that tells them inventory stopped being
      # released. PID 1 is the command itself in a container, so this is also
      # stricter than pgrep, which would match any process on the box.
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q run_scheduled_jobs"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Outbox worker ───────────────────────────────────────────────────────
  # The durable half of the outbox. `UnitOfWork` drains synchronously on
  # commit, which is enough in dev; this process exists because a crash
  # between COMMIT and that on-commit hook would otherwise strand the event
  # forever — and those events are what send tickets, refunds and reminders.
  #
  # It is also what executes background tasks while `QUEUE_BACKEND=local`,
  # since that adapter runs a task inline in whichever process enqueued it.
  worker:
    <<: *backend
    command: ["python", "-m", "config.worker"]
    deploy:
      replicas: 1
    healthcheck:
      # See the scheduler's healthcheck above for why this reads /proc/1
      # instead of calling pgrep.
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q config.worker"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Migrations ──────────────────────────────────────────────────────────
  # A PROFILE, so it never runs automatically. Auto-migrating on container
  # start was doing two dangerous things: applying unreviewed schema changes
  # to production on every deploy, and racing itself across replicas.
  #
  #   docker compose -f docker-compose.yml --profile migrate run --rm migrate
  #
  # Uses DIRECT_DATABASE_URL (Supavisor SESSION mode, port 5432) because DDL
  # through a transaction pooler is unreliable — see manage.py migrate_safe,
  # which enforces that and refuses to apply a migration nobody has reviewed.
  migrate:
    <<: *backend
    profiles: ["migrate"]
    restart: "no"
    command: ["python", "manage.py", "migrate_safe"]
