# =============================================================================
# Eventful — LOCAL DEVELOPMENT
# =============================================================================
# Compose loads this automatically on top of docker-compose.yml, so
# `docker compose up -d` is development and
# `docker compose -f docker-compose.yml up -d` is production.
#
# ── WHY THIS FILE EXISTS ────────────────────────────────────────────────────
#
# The database and Redis overrides below used to live in the production
# compose file, where `environment:` silently outranks `env_file:`. The result
# was that a correctly configured Supabase and Upstash in `.env` were ignored
# and every write went to a local Postgres — with nothing anywhere saying so.
#
# The overrides are unchanged in substance and entirely intentional; what
# changed is that they are now in a file called "override", loaded only in
# development. `.env` is authoritative in production.
#
# ── WHAT THIS DELIBERATELY POINTS AWAY FROM ─────────────────────────────────
#
# `.env` holds LIVE Supabase, Upstash and Razorpay credentials. Local
# development must not write to them, so the three lines below redirect the
# database and cache to containers. Payments are redirected too — see
# PAYMENTS_BACKEND.
# =============================================================================

services:
  # ── THE LOCAL DATABASE, NOW OPT-IN ──────────────────────────────────────
  #
  # The application runs against Supabase (see `.env`). These two stay in the
  # file because `pytest` still needs a database it is allowed to CREATE and
  # DROP, and Supabase is emphatically not that — `config/settings/test.py`
  # refuses a non-local host for exactly that reason.
  #
  # Behind a profile rather than deleted, and behind a profile rather than
  # left running: a Postgres that starts on every `docker compose up` is a
  # database somebody will point something at by accident, which is how the
  # Supabase URLs in `.env` came to be inert in the first place.
  #
  #   docker compose --profile localdb up -d postgres pgbouncer
  postgres:
    profiles: ["localdb"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: eventsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d eventsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for Supabase's Supavisor pooler: a real PgBouncer in
  # transaction-pooling mode with TLS required, so the app<->pooler config
  # (DISABLE_SERVER_SIDE_CURSORS, CONN_MAX_AGE=0, sslmode=require) is
  # exercised for real rather than only in production.
  pgbouncer:
    profiles: ["localdb"]
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/eventsdb
      POOL_MODE: transaction
      AUTH_TYPE: plain
      LISTEN_ADDR: 0.0.0.0
      LISTEN_PORT: 6432
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      ADMIN_USERS: app
      CLIENT_TLS_SSLMODE: require
      CLIENT_TLS_KEY_FILE: /tls/pgbouncer.key
      CLIENT_TLS_CERT_FILE: /tls/pgbouncer.crt
      CLIENT_TLS_CA_FILE: /tls/ca.crt
    volumes:
      - ./docker/dev-tls/certs:/tls:ro
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Local Redis: OPT-IN, and not started by default ─────────────────────
  #
  # Development points at Upstash (see the note on REDIS_URL below), so this
  # is here for the two cases that instance cannot serve: working offline, and
  # debugging a cache problem without touching the shared one.
  #
  # It is a PROFILE rather than a running-but-unused container for the same
  # reason `migrate` is one: a service in the compose file that nothing
  # connects to reads, to the next person, as the thing the app is using.
  #
  #     docker compose --profile local-redis up -d redis
  #     REDIS_URL=rediss://redis:6380/0?ssl_cert_reqs=none docker compose up web
  #
  # Its TLS listener is on a second port so `rediss://` is exercised for real
  # even locally; the plain port stays open for the healthcheck only.
  redis:
    profiles: ["local-redis"]
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --tls-port 6380
      --tls-cert-file /tls/redis.crt
      --tls-key-file /tls/redis.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients no
    volumes:
      - ./docker/dev-tls/certs:/tls:ro
    ports:
      - "6379:6379"
      - "6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Development web process ─────────────────────────────────────────────
  # `runserver` is correct HERE and only here: autoreload is the point of a
  # dev loop, and this file is never used in production.
  web:
    build:
      context: ./backend
      args:
        # The `dev` extra (pytest, ruff, mypy, silk) on top of the production
        # set. Deliberately NOT in the production image: a test runner and a
        # profiler are attack surface and image weight that production has no
        # use for.
        INSTALL_EXTRAS: "razorpay,push,observability,s3,dev"
    environment: &dev-env
      # THE OVERRIDES. Explicit, named, and development-only.
      #
      # `config.settings.cloud`, NOT `.dev`: this stack runs against the real
      # Supabase Postgres in `.env`, and `.dev` refuses a non-local database
      # for a good reason (DEBUG=True + CORS_ALLOW_ALL_ORIGINS over real data
      # renders SECRET_KEY to any caller). See that module's docstring for the
      # three things it relaxes and why each is safe on loopback only.
      DJANGO_SETTINGS_MODULE: config.settings.cloud
      # DATABASE_URL and DIRECT_DATABASE_URL ARE DELIBERATELY ABSENT.
      #
      # They were set here to a local Postgres, and `environment:` outranks
      # `env_file:` — so the Supabase URLs in `.env` were INERT and every write
      # went to a container with nothing anywhere saying so. That is the exact
      # trap the header of `docker-compose.yml` documents, and it had been
      # sprung on this file.
      #
      # `pytest` is the reason the local values were here: it CREATES and DROPS
      # `test_<dbname>`, which must never happen on Supabase. That guard now
      # lives where it cannot be bypassed by editing this file —
      # `config/settings/test.py` refuses a non-local host outright. To run the
      # suite, point it at a local database explicitly:
      #
      #   DIRECT_DATABASE_URL=postgres://app:app@localhost:5432/eventsdb       #     .venv/Scripts/python -m pytest
      #
      # with the `localdb` profile up (`docker compose --profile localdb up -d`).
      # REDIS_URL IS DELIBERATELY ABSENT.
      #
      # `environment:` outranks `env_file:`, so setting it here would make the
      # `REDIS_URL` in `.env` inert — which is exactly the bug the header of
      # `docker-compose.yml` warns about, and it is how a carefully configured
      # managed cache ends up unused with nothing anywhere saying so.
      #
      # Development now uses the SAME Upstash instance the deployed app does.
      # That is a real trade and it is the right one: the cache is the layer
      # where "works locally" diverges most from production — TLS, an
      # off-box round trip, dropped idle connections, rate limits — and none
      # of those are exercised by a Redis in the next container.
      #
      # `core/adapters/redis/adapter.py` fails OPEN, so a dropped connection
      # degrades to a database read rather than a 500. That handling exists
      # BECAUSE of this line's absence.
      #
      # To work offline, or against a local Redis, start the profile below and
      # export `REDIS_URL=rediss://redis:6380/0?ssl_cert_reqs=none`.
      DISABLE_SERVER_SIDE_CURSORS: "true"
      CONN_MAX_AGE: "0"
      CACHE_BACKEND: redis
      # A switch, defaulting to the fake adapter — the same shape as
      # DEV_EMAIL_PROVIDER below, and for the same reason.
      #
      # This was hard-coded `fake`, on the stated grounds that "`.env` carries
      # LIVE Razorpay keys". It does not: the key there is `rzp_test_…`, which
      # is Razorpay's sandbox, moves no real money, and is the credential you
      # are SUPPOSED to develop against. So the hard-code was protecting
      # against something that was not true, at the cost of never exercising
      # the real gateway before production did.
      #
      # The live-key danger is real, and it is still guarded — but by the
      # thing that can actually check it: `core.preflight.
      # check_development_settings` REFUSES to boot dev with an `rzp_live_`
      # key, whatever this is set to. A conditional guard beats a blanket one,
      # because a blanket one gets switched off by whoever needs it off.
      PAYMENTS_BACKEND: ${DEV_PAYMENTS_BACKEND:-fake}
      # Likewise: no real email out of a development container BY DEFAULT.
      #
      # But "the code never arrives" is indistinguishable from a broken
      # pipeline when the only place it appears is a container log, so this
      # is a switch rather than a hard-coded value. Set DEV_EMAIL_PROVIDER=smtp
      # in `.env` and recreate the web/worker services to send for real
      # through the SMTP_* credentials already there.
      #
      # The DEFAULT is still console: a development container that mails
      # real people the moment somebody runs a seed script is how a test
      # fixture ends up in a customer's inbox.
      EMAIL_PROVIDER: ${DEV_EMAIL_PROVIDER:-console}
      # STORAGE_BACKEND IS DELIBERATELY ABSENT — same reason as the database
      # URLs above. It was pinned to `local`, so uploads went to the
      # container's disk and vanished on restart while a fully working S3
      # bucket sat configured in `.env` and unused.
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000 --insecure"
    volumes:
      # Bind mount for hot reload. Development only — the production file has
      # no volumes, so the image is immutable there.
      - ./backend:/app
    # No `depends_on`: the database is Supabase and the cache is Upstash,
    # both already up. Waiting on a profiled container that is not started
    # would hang `docker compose up` forever.
      # No `redis` here, and that is not an omission: the cache is Upstash and
      # is already up. Waiting on a profiled container that is not started
      # would hang `docker compose up` forever.

  scheduler:
    environment: *dev-env
    # No `depends_on`: the database is Supabase and the cache is Upstash,
    # both already up. Waiting on a profiled container that is not started
    # would hang `docker compose up` forever.
    volumes:
      - ./backend:/app

  worker:
    environment: *dev-env
    # No `depends_on`: the database is Supabase and the cache is Upstash,
    # both already up. Waiting on a profiled container that is not started
    # would hang `docker compose up` forever.
    volumes:
      - ./backend:/app

  migrate:
    environment: *dev-env
    volumes:
      - ./backend:/app

volumes:
  pgdata:
